services:
  mysql:
    image: mysql:8.0
    container_name: balieasy-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-balieasy_sourcing}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-balieasy}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - balieasy-mysql-data:/var/lib/mysql
    networks:
      - balieasy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: balieasy-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_PMA_PORT:-8081}:80"
    depends_on:
      - mysql
    networks:
      - balieasy-network

volumes:
  balieasy-mysql-data:
    driver: local

networks:
  balieasy-network:
    driver: bridge

