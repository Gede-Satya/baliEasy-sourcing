services:
  # 1. Laravel Application (PHP 8.3 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balieasy-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-balieasy_sourcing}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - .:/var/www/html
    networks:
      - balieasy-network
    depends_on:
      mysql:
        condition: service_healthy

  # 2. Nginx Web Server
  web:
    image: nginx:alpine
    container_name: balieasy-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - balieasy-network
    depends_on:
      - app

  # 3. MySQL Database
  mysql:
    image: mysql:8.0
    container_name: balieasy-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-balieasy_sourcing}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - balieasy-mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - balieasy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 4. phpMyAdmin Dashboard
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: balieasy-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_PMA_PORT:-8081}:80"
    depends_on:
      - mysql
    networks:
      - balieasy-network

volumes:
  balieasy-mysql-data:
    driver: local

networks:
  balieasy-network:
    driver: bridge
